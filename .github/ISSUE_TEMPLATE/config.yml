blank_issues_enabled: false
contact_links:
  - name: Question or discussion
    url: https://github.com/sourav2024/expopulse/discussions
    about: >
      Ask how something works, check whether a finding is correct, or propose an
      idea before writing it up as an issue.

  - name: Report a security vulnerability
    url: https://github.com/sourav2024/expopulse/security/advisories/new
    about: >
      Report privately. Do not open a public issue — `expopulse fix` writes to
      users' files, so disclosure is handled through a private advisory.

  - name: Support and troubleshooting
    url: https://github.com/sourav2024/expopulse/blob/main/SUPPORT.md
    about: >
      Where to ask what, how to file a report that can be acted on, and
      workarounds while you wait.
